{% extends "app.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
    <h1 class="text-2xl font-bold">Gerenciar Clientes</h1>
    <button onclick="openModal()" class="btn-green font-bold py-2 px-4 rounded shadow">
        + Novo Cliente
    </button>
</div>

<div class="bg-[#242424] rounded-lg overflow-hidden shadow">
    <table class="w-full table-dark text-sm">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>Nível (Score)</th>
            </tr>
        </thead>
        <tbody id="clientesTableBody">
            <!-- Populado via JS -->
        </tbody>
    </table>
</div>

<!-- Modal Novo Cliente -->
<div id="modalCliente" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
    <div class="bg-[#2a2a2a] p-6 rounded-lg shadow-xl w-full max-w-lg border border-gray-600">
        <h2 class="text-xl font-bold mb-4">Novo Cliente</h2>
        
        <form id="formCliente" onsubmit="saveCliente(event)">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="col-span-2">
                    <label class="block text-sm mb-1 text-gray-300">Nome Completo</label>
                    <input type="text" id="c_nome" required class="input-dark">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">CPF</label>
                    <input type="text" id="c_cpf" required class="input-dark">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Data Nasc.</label>
                    <input type="date" id="c_nasc" required class="input-dark">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Telefone</label>
                    <input type="text" id="c_telefone" required class="input-dark">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Renda Mensal</label>
                    <input type="number" id="c_renda" step="0.01" required class="input-dark">
                </div>
            </div>
            
            <div class="flex justify-end gap-3 mt-6">
                <button type="button" onclick="closeModal()" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded transition">Cancelar</button>
                <button type="submit" id="btnSalvar" class="btn-green px-4 py-2 rounded shadow font-bold">Salvar Cliente</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openModal() {
        document.getElementById('modalCliente').classList.remove('hidden');
        document.getElementById('modalCliente').classList.add('flex');
    }
    
    function closeModal() {
        document.getElementById('modalCliente').classList.add('hidden');
        document.getElementById('modalCliente').classList.remove('flex');
        document.getElementById('formCliente').reset();
    }

    async function loadClientes() {
        try {
            const data = await fetchAPI('/clientes/');
            const tbody = document.getElementById('clientesTableBody');
            tbody.innerHTML = '';
            
            data.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${c.id}</td>
                    <td>${c.nome}</td>
                    <td>${c.cpf}</td>
                    <td>${c.telefone}</td>
                    <td>${c.nivel_score}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error(error);
        }
    }

    async function saveCliente(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSalvar');
        btn.disabled = true;
        btn.innerText = "Salvando...";
        
        const payload = {
            nome: document.getElementById('c_nome').value,
            cpf: document.getElementById('c_cpf').value.replace(/\D/g, ''),
            data_nascimento: document.getElementById('c_nasc').value,
            telefone: document.getElementById('c_telefone').value,
            renda_mensal: parseFloat(document.getElementById('c_renda').value)
        };
        
        try {
            await fetchAPI('/clientes/', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            Swal.fire('Sucesso', 'Cliente cadastrado com sucesso!', 'success');
            closeModal();
            loadClientes();
        } catch (error) {
            Swal.fire('Erro', error.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerText = "Salvar Cliente";
        }
    }

    window.onload = loadClientes;
</script>
{% endblock %}
