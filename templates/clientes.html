{% extends "app.html" %}

{% block content %}
<div class="flex flex-col md:flex-row md:justify-between items-start md:items-center gap-4 mb-6 border-b page-border pb-4">
    <h1 class="text-2xl font-bold heading-text">Gerenciar Clientes</h1>
    <button onclick="openModal()" class="btn-green font-bold py-2 px-4 rounded shadow w-full md:w-auto">
        + Novo Cliente
    </button>
</div>

<div class="card rounded-lg overflow-x-auto shadow">
    <table class="w-full table-theme text-sm">
        <thead>
            <tr>
                <th class="text-center">Nome</th>
                <th class="text-center">CPF</th>
                <th class="text-center">Telefone</th>
                <th class="text-center">Ações</th>
            </tr>
        </thead>
        <tbody id="clientesTableBody"></tbody>
    </table>
</div>

<!-- Modal Novo/Editar Cliente -->
<div id="modalCliente" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="modal-bg p-4 md:p-6 rounded-lg shadow-xl w-full max-w-lg max-h-full overflow-y-auto">
        <h2 id="modalTitulo" class="text-xl font-bold mb-4 heading-text">Novo Cliente</h2>
        <form id="formCliente" onsubmit="saveCliente(event)">
            <input type="hidden" id="c_id" value="">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div class="col-span-2">
                    <label class="block text-sm mb-1 label-text">Nome Completo</label>
                    <input type="text" id="c_nome" required class="input-field" oninput="this.value=this.value.toUpperCase()">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm mb-1 label-text">CPF</label>
                    <input type="text" id="c_cpf" required class="input-field" inputmode="numeric" maxlength="14" oninput="mascaraCPF(this)" placeholder="000.000.000-00">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm mb-1 label-text">Telefone</label>
                    <input type="text" id="c_telefone" required class="input-field" inputmode="numeric" oninput="mascaraTelefone(this)" maxlength="15" placeholder="(00) 00000-0000">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm mb-1 label-text">E-mail</label>
                    <input type="email" id="c_email" class="input-field" oninput="this.value=this.value.toLowerCase()" placeholder="email@exemplo.com">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm mb-1 label-text">CEP</label>
                    <input type="text" id="c_cep" class="input-field" inputmode="numeric" onblur="buscarCEP()" maxlength="9" oninput="mascaraCEP(this)" placeholder="00000-000">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm mb-1 label-text">Endereço Completo</label>
                    <input type="text" id="c_endereco" class="input-field" oninput="this.value=this.value.toUpperCase()">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm mb-1 label-text font-semibold">Doc. Identidade (RG/CPF)</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="c_doc_identidade" class="flex flex-col items-center justify-center w-full h-24 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 dark:bg-[#2A2D35] dark:border-gray-600 dark:hover:bg-[#32363F] transition-colors">
                            <div class="flex flex-col items-center justify-center pt-3 pb-4">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-400 mb-2"></i>
                                <p class="text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold text-green-600 dark:text-green-400">Clique para enviar</span> ou tire uma foto</p>
                                <p class="text-xs text-gray-500 mt-1" id="name_doc_identidade">Nenhum arquivo selecionado</p>
                            </div>
                            <input type="file" id="c_doc_identidade" accept="image/*,application/pdf" class="hidden" onchange="document.getElementById('name_doc_identidade').innerText = this.files[0] ? this.files[0].name : 'Nenhum arquivo selecionado'">
                        </label>
                    </div>
                </div>
                <div class="col-span-2">
                    <label class="block text-sm mb-1 label-text font-semibold">Comprovante de Endereço</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="c_doc_endereco" class="flex flex-col items-center justify-center w-full h-24 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 dark:bg-[#2A2D35] dark:border-gray-600 dark:hover:bg-[#32363F] transition-colors">
                            <div class="flex flex-col items-center justify-center pt-3 pb-4">
                                <i class="fa-solid fa-file-invoice text-2xl text-gray-400 mb-2"></i>
                                <p class="text-sm text-gray-500 dark:text-gray-400"><span class="font-semibold text-green-600 dark:text-green-400">Clique para enviar</span> ou tire uma foto</p>
                                <p class="text-xs text-gray-500 mt-1" id="name_doc_endereco">Nenhum arquivo selecionado</p>
                            </div>
                            <input type="file" id="c_doc_endereco" accept="image/*,application/pdf" class="hidden" onchange="document.getElementById('name_doc_endereco').innerText = this.files[0] ? this.files[0].name : 'Nenhum arquivo selecionado'">
                        </label>
                    </div>
                </div>
            </div>
            <div class="flex flex-col-reverse md:flex-row justify-end gap-3 mt-6">
                <button type="button" onclick="closeModal()" class="bg-gray-400 hover:bg-gray-500 dark:bg-gray-600 dark:hover:bg-gray-700 text-white px-4 py-2 rounded transition w-full md:w-auto">Cancelar</button>
                <button type="submit" id="btnSalvar" class="btn-green px-4 py-2 rounded shadow font-bold w-full md:w-auto">Salvar Cliente</button>
            </div>
        </form>
    </div>
</div>

<script>
    function mascaraCPF(el) {
        let v = el.value.replace(/\D/g, '').slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d)/, '$1.$2');
        v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        el.value = v;
    }
    function mascaraCEP(el) {
        let v = el.value.replace(/\D/g, '').slice(0, 8);
        v = v.replace(/(\d{5})(\d)/, '$1-$2');
        el.value = v;
    }
    function mascaraTelefone(el) {
        let v = el.value.replace(/\D/g, '').slice(0, 11);
        if (v.length <= 10) {
            v = v.replace(/(\d{2})(\d)/, '($1) $2');
            v = v.replace(/(\d{4})(\d)/, '$1-$2');
        } else {
            v = v.replace(/(\d{2})(\d)/, '($1) $2');
            v = v.replace(/(\d{5})(\d)/, '$1-$2');
        }
        el.value = v;
    }

    function openModal(clienteId = null) {
        document.getElementById('modalCliente').classList.remove('hidden');
        document.getElementById('modalCliente').classList.add('flex');
        if (clienteId) {
            document.getElementById('modalTitulo').innerText = 'Editar Cliente';
            document.getElementById('btnSalvar').innerText = 'Atualizar Cliente';
            carregarDadosCliente(clienteId);
        } else {
            document.getElementById('modalTitulo').innerText = 'Novo Cliente';
            document.getElementById('btnSalvar').innerText = 'Salvar Cliente';
            document.getElementById('c_id').value = '';
        }
    }

    async function carregarDadosCliente(clienteId) {
        try {
            const c = await fetchAPI(`/clientes/${clienteId}`);
            document.getElementById('c_id').value = clienteId;
            document.getElementById('c_nome').value = c.nome || '';
            let cpf = c.cpf || '';
            if (cpf.length === 11) cpf = cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
            document.getElementById('c_cpf').value = cpf;
            document.getElementById('c_telefone').value = c.telefone || '';
            document.getElementById('c_email').value = c.email || '';
            document.getElementById('c_cep').value = c.cep || '';
            document.getElementById('c_endereco').value = c.endereco || '';
        } catch(e) {
            Swal.fire('Erro', 'Não foi possível carregar os dados do cliente.', 'error');
        }
    }

    function closeModal() {
        document.getElementById('modalCliente').classList.add('hidden');
        document.getElementById('modalCliente').classList.remove('flex');
        document.getElementById('formCliente').reset();
        document.getElementById('c_id').value = '';
    }

    function getBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve(""); return; }
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function visualizarDocs(cliente_id) {
        try {
            const cliente = await fetchAPI(`/clientes/${cliente_id}`);
            if (cliente.doc_identidade || cliente.doc_endereco) {
                let html = '<div class="flex flex-col gap-4">';
                if (cliente.doc_identidade) {
                    html += `<div><h3 class="font-bold mb-2">Documento de Identidade (RG/CPF)</h3>`;
                    if (cliente.doc_identidade.startsWith('data:application/pdf')) {
                        html += `<iframe src="${cliente.doc_identidade}" class="w-full h-64 border"></iframe>`;
                    } else {
                        html += `<img src="${cliente.doc_identidade}" class="max-w-full rounded">`;
                    }
                    html += `</div>`;
                }
                if (cliente.doc_endereco) {
                    html += `<div><h3 class="font-bold mb-2">Comprovante de Endereço</h3>`;
                    if (cliente.doc_endereco.startsWith('data:application/pdf')) {
                        html += `<iframe src="${cliente.doc_endereco}" class="w-full h-64 border"></iframe>`;
                    } else {
                        html += `<img src="${cliente.doc_endereco}" class="max-w-full rounded">`;
                    }
                    html += `</div>`;
                }
                html += '</div>';
                Swal.fire({ title: 'Documentos do Cliente', html: html, width: '80%', showCloseButton: true });
            } else {
                Swal.fire('Aviso', 'Este cliente não possui documentos cadastrados.', 'info');
            }
        } catch(e) {
            Swal.fire('Erro', 'Não foi possível carregar os documentos.', 'error');
        }
    }

    async function loadClientes() {
        try {
            const data = await fetchAPI('/clientes/');
            const tbody = document.getElementById('clientesTableBody');
            tbody.innerHTML = '';
            data.forEach(c => {
                const docIdIcon = c.tem_doc_identidade
                    ? `<span title="Identidade enviada" class="inline-flex items-center gap-1 bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300 text-xs px-2 py-0.5 rounded">✅ RG/CPF</span>`
                    : `<span title="Sem documento de identidade" class="inline-flex items-center gap-1 bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300 text-xs px-2 py-0.5 rounded">❌ RG/CPF</span>`;
                const docEndIcon = c.tem_doc_endereco
                    ? `<span title="Comprovante enviado" class="inline-flex items-center gap-1 bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300 text-xs px-2 py-0.5 rounded">✅ Endereço</span>`
                    : `<span title="Sem comprovante de endereço" class="inline-flex items-center gap-1 bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300 text-xs px-2 py-0.5 rounded">❌ Endereço</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">${c.nome}</td>
                    <td class="text-center">${formatarCPF(c.cpf)}</td>
                    <td class="text-center">${c.telefone}</td>
                    <td class="text-center">
                        <div class="flex justify-center gap-1 flex-wrap mb-1">
                            ${docIdIcon}${docEndIcon}
                        </div>
                        <div class="flex justify-center gap-2 flex-wrap">
                            <button onclick="openModal(${c.id})" class="text-yellow-500 hover:text-yellow-400" title="Editar">✏️ Editar</button>
                            <button onclick="visualizarDocs(${c.id})" class="text-blue-500 hover:text-blue-700" title="Documentos">📄 Docs</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) { console.error(error); }
    }

    async function saveCliente(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSalvar');
        btn.disabled = true; btn.innerText = "Salvando...";
        const clienteId = document.getElementById('c_id').value;
        const isEditing = clienteId !== '';
        const doc_identidade = await getBase64(document.getElementById('c_doc_identidade').files[0]);
        const doc_endereco = await getBase64(document.getElementById('c_doc_endereco').files[0]);
        const payload = {
            nome: document.getElementById('c_nome').value,
            cpf: document.getElementById('c_cpf').value.replace(/\D/g, ''),
            telefone: document.getElementById('c_telefone').value,
            email: document.getElementById('c_email').value,
            cep: document.getElementById('c_cep').value,
            endereco: document.getElementById('c_endereco').value,
            doc_identidade, doc_endereco
        };
        try {
            if (isEditing) {
                await fetchAPI(`/clientes/${clienteId}`, { method: 'PUT', body: JSON.stringify(payload) });
                Swal.fire('Sucesso', 'Cliente atualizado com sucesso!', 'success');
            } else {
                await fetchAPI('/clientes/', { method: 'POST', body: JSON.stringify(payload) });
                Swal.fire('Sucesso', 'Cliente cadastrado com sucesso!', 'success');
            }
            closeModal(); loadClientes();
        } catch (error) { Swal.fire('Erro', error.message, 'error'); }
        finally { btn.disabled = false; btn.innerText = isEditing ? "Atualizar Cliente" : "Salvar Cliente"; }
    }

    async function buscarCEP() {
        let cep = document.getElementById('c_cep').value.replace(/\D/g, '');
        if (cep.length === 8) {
            try {
                const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await res.json();
                if (!data.erro) document.getElementById('c_endereco').value = `${data.logradouro}, ${data.bairro}, ${data.localidade} - ${data.uf}`;
            } catch (e) { console.error("Erro ao buscar CEP:", e); }
        }
    }

    window.onload = loadClientes;
</script>
{% endblock %}
