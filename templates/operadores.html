{% extends "app.html" %}

{% block content %}
<div class="flex flex-col md:flex-row md:justify-between items-start md:items-center gap-4 mb-6 border-b page-border pb-4">
    <h1 class="text-2xl font-bold heading-text">Gerenciar Operadores</h1>
    <button onclick="openModal()" class="btn-green font-bold py-2 px-4 rounded shadow w-full md:w-auto">
        + Novo Operador
    </button>
</div>

<div class="card rounded-lg overflow-x-auto shadow">
    <table class="w-full table-theme text-sm">
        <thead>
            <tr>
                <th class="text-center">Nome</th>
                <th class="text-center">Login</th>
                <th class="text-center">Tipo</th>
                <th class="text-center">Status</th>
                <th class="text-center">Ações</th>
            </tr>
        </thead>
        <tbody id="operadoresTableBody"></tbody>
    </table>
</div>

<!-- Modal Novo/Editar Operador -->
<div id="modalOperador" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="modal-bg p-4 md:p-6 rounded-lg shadow-xl w-full max-w-md max-h-full overflow-y-auto">
        <h2 id="modalTitulo" class="text-xl font-bold mb-4 heading-text">Novo Operador</h2>
        <form id="formOperador" onsubmit="saveOperador(event)">
            <input type="hidden" id="o_id" value="">
            <div class="grid grid-cols-1 gap-4 mb-4">
                <div>
                    <label class="block text-sm mb-1 label-text">Nome Completo</label>
                    <input type="text" id="o_nome" required class="input-field" oninput="this.value=this.value.toUpperCase()">
                </div>
                <div>
                    <label class="block text-sm mb-1 label-text">Login</label>
                    <input type="text" id="o_login" required class="input-field" oninput="this.value=this.value.toLowerCase()">
                </div>
                <div>
                    <label class="block text-sm mb-1 label-text">Senha <span id="senha_hint" class="text-xs text-gray-500 font-normal hidden">(Deixe em branco para manter a atual)</span></label>
                    <input type="password" id="o_senha" class="input-field">
                </div>
                <div>
                    <label class="block text-sm mb-1 label-text">Tipo de Acesso</label>
                    <select id="o_tipo" required class="input-field">
                        <option value="FUNCIONARIO">Funcionário</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
                <div id="div_ativo" class="hidden">
                    <label class="block text-sm mb-1 label-text">Status</label>
                    <select id="o_ativo" class="input-field">
                        <option value="true">Ativo</option>
                        <option value="false">Inativo</option>
                    </select>
                </div>
            </div>
            <div class="flex flex-col-reverse md:flex-row justify-end gap-3 mt-6">
                <button type="button" onclick="closeModal()" class="bg-gray-400 hover:bg-gray-500 dark:bg-gray-600 dark:hover:bg-gray-700 text-white px-4 py-2 rounded transition w-full md:w-auto">Cancelar</button>
                <button type="submit" id="btnSalvar" class="btn-green px-4 py-2 rounded shadow font-bold w-full md:w-auto">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script>
    let operadores_data = [];

    function openModal(id = null) {
        document.getElementById('modalOperador').classList.remove('hidden');
        document.getElementById('modalOperador').classList.add('flex');
        const isEditing = id !== null;
        
        if (isEditing) {
            document.getElementById('modalTitulo').innerText = 'Editar Operador';
            document.getElementById('btnSalvar').innerText = 'Atualizar';
            document.getElementById('o_senha').required = false;
            document.getElementById('senha_hint').classList.remove('hidden');
            document.getElementById('div_ativo').classList.remove('hidden');
            carregarDadosModal(id);
        } else {
            document.getElementById('modalTitulo').innerText = 'Novo Operador';
            document.getElementById('btnSalvar').innerText = 'Salvar';
            document.getElementById('o_id').value = '';
            document.getElementById('formOperador').reset();
            document.getElementById('o_senha').required = true;
            document.getElementById('senha_hint').classList.add('hidden');
            document.getElementById('div_ativo').classList.add('hidden');
        }
    }

    function carregarDadosModal(id) {
        const op = operadores_data.find(o => o.id === id);
        if(!op) return;
        document.getElementById('o_id').value = op.id;
        document.getElementById('o_nome').value = op.nome;
        document.getElementById('o_login').value = op.login;
        document.getElementById('o_senha').value = '';
        document.getElementById('o_tipo').value = op.tipo;
        document.getElementById('o_ativo').value = op.ativo ? "true" : "false";
    }

    function closeModal() {
        document.getElementById('modalOperador').classList.add('hidden');
        document.getElementById('modalOperador').classList.remove('flex');
        document.getElementById('formOperador').reset();
    }

    async function loadOperadores() {
        try {
            const data = await fetchAPI('/usuarios/');
            operadores_data = data;
            const tbody = document.getElementById('operadoresTableBody');
            tbody.innerHTML = '';
            data.forEach(op => {
                const statusBadge = op.ativo 
                    ? `<span class="bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300 text-xs px-2 py-1 rounded">Ativo</span>`
                    : `<span class="bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-300 text-xs px-2 py-1 rounded">Inativo</span>`;
                
                const tipoBadge = op.tipo === 'ADMIN'
                    ? `<span class="text-xs font-bold text-blue-600 dark:text-blue-400">ADMIN</span>`
                    : `<span class="text-xs text-gray-600 dark:text-gray-400">FUNCIONÁRIO</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">${op.nome}</td>
                    <td class="text-center font-mono text-sm">${op.login}</td>
                    <td class="text-center">${tipoBadge}</td>
                    <td class="text-center">${statusBadge}</td>
                    <td class="text-center">
                        <div class="flex justify-center gap-2 flex-wrap">
                            <button onclick="openModal(${op.id})" class="text-yellow-500 hover:text-yellow-400" title="Editar">✏️ Editar</button>
                            ${op.ativo ? `<button onclick="desativarOperador(${op.id})" class="text-red-500 hover:text-red-700" title="Desativar">🗑️ Desativar</button>` : ''}
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            if(error.message.includes('403')) {
                 Swal.fire('Acesso Negado', 'Você não tem permissão para gerenciar operadores.', 'error');
            } else {
                 console.error(error);
            }
        }
    }

    async function saveOperador(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSalvar');
        btn.disabled = true; btn.innerText = "Salvando...";
        
        const id = document.getElementById('o_id').value;
        const isEditing = id !== '';
        
        const payload = {
            nome: document.getElementById('o_nome').value,
            login: document.getElementById('o_login').value,
            tipo: document.getElementById('o_tipo').value
        };

        const senha = document.getElementById('o_senha').value;
        if(senha) payload.senha = senha;
        
        if(isEditing) {
            payload.ativo = document.getElementById('o_ativo').value === "true";
        }

        try {
            if (isEditing) {
                await fetchAPI(`/usuarios/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
                Swal.fire('Sucesso', 'Operador atualizado com sucesso!', 'success');
            } else {
                await fetchAPI('/usuarios/', { method: 'POST', body: JSON.stringify(payload) });
                Swal.fire('Sucesso', 'Operador cadastrado com sucesso!', 'success');
            }
            closeModal();
            loadOperadores();
        } catch (error) { 
            Swal.fire('Erro', error.message, 'error'); 
        } finally { 
            btn.disabled = false; 
            btn.innerText = isEditing ? "Atualizar" : "Salvar"; 
        }
    }

    async function desativarOperador(id) {
        const result = await Swal.fire({
            title: 'Tem certeza?',
            text: "Este operador não poderá mais acessar o sistema.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Sim, desativar!',
            cancelButtonText: 'Cancelar'
        });

        if (result.isConfirmed) {
            try {
                await fetchAPI(`/usuarios/${id}`, { method: 'DELETE' });
                Swal.fire('Desativado!', 'O operador foi desativado.', 'success');
                loadOperadores();
            } catch (error) {
                Swal.fire('Erro', error.message, 'error');
            }
        }
    }

    window.onload = loadOperadores;
</script>
{% endblock %}
