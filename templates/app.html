{% extends "base.html" %}

{% block layout %}
<div class="flex h-full w-full">
    <!-- Sidebar -->
    <div class="sidebar-app w-64 h-full flex flex-col items-center py-6 shadow-lg">
        <img src="/assets/logo/logo.png" alt="Capital Credity" class="w-48 mb-8" onerror="this.src=''">
        
        <div class="w-full px-4 flex flex-col gap-3 flex-grow">
            <a href="/" class="btn-green rounded px-4 py-2 text-center w-full block">Dashboard</a>
            <a href="/clientes" class="btn-green rounded px-4 py-2 text-center w-full block">Clientes</a>
            <a href="/emprestimos" class="btn-green rounded px-4 py-2 text-center w-full block">Empréstimos</a>
            <a href="/recebimentos" class="btn-green rounded px-4 py-2 text-center w-full block">Recebimentos</a>
            <a href="/relatorios" class="btn-green rounded px-4 py-2 text-center w-full block">Relatórios</a>
            <a href="/politica" class="border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-dark-700 rounded px-4 py-2 text-center w-full block mt-2 transition">Política de Crédito</a>
        </div>

        <!-- Theme Toggle + Logout -->
        <div class="w-full px-4 mt-auto flex flex-col gap-3">
            <div class="flex items-center justify-between px-2">
                <span class="text-sm label-text">Tema</span>
                <div id="themeToggle" class="theme-toggle light" onclick="toggleTheme()">
                    <div class="toggle-knob">☀️</div>
                </div>
            </div>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white rounded px-4 py-2 w-full text-center transition">
                Sair do Sistema
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-grow h-full p-8 overflow-y-auto content-area">
        {% block content %}{% endblock %}
    </div>
</div>

<script>
    // Inicializar visual do toggle ao carregar
    document.addEventListener('DOMContentLoaded', function() {
        const isDark = document.documentElement.classList.contains('dark');
        updateToggleButton(isDark);
    });
</script>
{% endblock %}
