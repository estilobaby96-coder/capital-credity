{% extends "base.html" %}

{% block layout %}
<!-- Contêiner principal, flex-col para mobile (header + content) e flex-row para desktop (sidebar + content) -->
<div class="flex flex-col md:flex-row h-full w-full relative">
    
    <!-- Mobile Header (Visível apenas em telas pequenas) -->
    <div class="md:hidden flex items-center justify-between p-4 bg-white dark:bg-[#252526] border-b border-gray-200 dark:border-gray-700 z-20">
        <img src="/assets/logo/logo.png" alt="Capital Credity" class="h-8" onerror="this.src=''">
        <button onclick="toggleMobileMenu()" class="text-gray-900 dark:text-white p-2 focus:outline-none">
            <i class="fa-solid fa-bars text-2xl"></i>
        </button>
    </div>

    <!-- Overlay escuro para quando a sidebar estiver aberta no mobile -->
    <div id="mobileOverlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden"></div>

    <!-- Sidebar -->
    <!-- No mobile: fixed, hidden por padrão, com Z-index alto para sobrepor. No desktop: static, h-full. -->
    <div id="appSidebar" class="sidebar-app w-64 h-full flex-col items-center py-6 shadow-lg fixed md:static inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-40 bg-white dark:bg-[#252526] flex">
        
        <div class="flex items-center justify-between w-full px-4 mb-8">
            <img src="/assets/logo/logo.png" alt="Capital Credity" class="w-32 md:w-48 mx-auto" onerror="this.src=''">
            <button onclick="toggleMobileMenu()" class="md:hidden text-gray-900 dark:text-white focus:outline-none absolute right-4">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        
        <nav class="flex-1 px-4 space-y-2 mt-4 overflow-y-auto">
            <a href="/" class="btn-green rounded px-4 py-2 text-center w-full block shadow transition">Dashboard</a>
            <a href="/clientes" class="btn-green rounded px-4 py-2 text-center w-full block shadow transition">Clientes</a>
            <a href="/emprestimos" class="btn-green rounded px-4 py-2 text-center w-full block shadow transition">Empréstimos</a>
            <a href="/recebimentos" class="btn-green rounded px-4 py-2 text-center w-full block shadow transition">Recebimentos</a>
            <a href="/relatorios" class="btn-green rounded px-4 py-2 text-center w-full block shadow transition">Relatórios</a>
        </nav>

        <!-- Theme Toggle + Logout -->
        <div class="w-full px-4 mt-auto flex flex-col gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
            <div class="flex items-center justify-between px-2">
                <span class="text-sm label-text">Tema</span>
                <div id="themeToggle" class="theme-toggle light" onclick="toggleTheme()">
                    <div class="toggle-knob">☀️</div>
                </div>
            </div>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white rounded px-4 py-2 w-full text-center transition">
                Sair
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-grow h-full p-4 md:p-8 overflow-y-auto content-area w-full">
        {% block content %}{% endblock %}
    </div>
</div>

<script>
    function formatarCPF(cpf) {
        if (!cpf) return "";
        cpf = cpf.replace(/\D/g, '');
        if (cpf.length === 11) {
            return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
        }
        return cpf;
    }

    function formatarDataBR(dataStr) {
        if (!dataStr || dataStr === '-') return dataStr;
        const dt = dataStr.split('T')[0];
        const parts = dt.split('-');
        if (parts.length === 3) {
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return dataStr;
    }

    // Inicializar visual do toggle ao carregar
    document.addEventListener('DOMContentLoaded', function() {
        const isDark = document.documentElement.classList.contains('dark');
        updateToggleButton(isDark);
    });

    // Função para abrir/fechar o menu no mobile
    function toggleMobileMenu() {
        const sidebar = document.getElementById('appSidebar');
        const overlay = document.getElementById('mobileOverlay');
        
        if (sidebar.classList.contains('-translate-x-full')) {
            // Abrir menu
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        } else {
            // Fechar menu
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }
    }
</script>
{% endblock %}
