{% extends "app.html" %}

{% block content %}
<div class="flex flex-col md:flex-row md:justify-between items-start md:items-center gap-4 mb-6 border-b page-border pb-4">
    <h1 class="text-2xl font-bold heading-text">Gestão de Recebimentos</h1>
    <button onclick="carregarPendentes()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded w-full md:w-auto">
        <i class="fa-solid fa-rotate-right mr-2"></i> Atualizar
    </button>
</div>

<div class="card rounded-lg shadow overflow-x-auto">
    <table class="w-full text-center text-sm table-theme">
        <thead>
            <tr>
                <th>Cliente</th>
                <th>Contrato</th>
                <th>Parcela</th>
                <th>Vencimento</th>
                <th>Dias Atraso</th>
                <th>Acréscimos</th>
                <th>Valor Atualizado</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaPendentes">
            <!-- Dados carregados via JS -->
        </tbody>
    </table>
</div>

<script>
    async function carregarPendentes() {
        const tbody = document.getElementById('tabelaPendentes');
        tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-4 text-center sub-text">Carregando...</td></tr>';
        
        try {
            const parcelas = await fetchAPI('/pagamentos/pendentes');
            tbody.innerHTML = '';
            
            if (parcelas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-4 text-center sub-text">Nenhuma parcela pendente ou atrasada.</td></tr>';
                return;
            }
            
            const formatter = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
            
            parcelas.forEach(p => {
                const isAtrasada = p.status === 'ATRASADA';
                const statusColor = isAtrasada ? 'text-red-600 dark:text-red-500' : 'text-yellow-600 dark:text-yellow-500';
                
                let dataFormatada = formatarDataBR(p.vencimento);

                const diasAtraso = p.dias_atraso || 0;
                const multa = p.multa || 0;
                const jurosMora = p.juros_mora || 0;
                const totalAcrescimos = multa + jurosMora;
                
                let acrescimosHtml = '-';
                if (totalAcrescimos > 0) {
                    acrescimosHtml = `<span class="text-red-600 dark:text-red-400 font-bold">+${formatter.format(totalAcrescimos)}</span>
                        <br><span class="text-xs sub-text">Multa: ${formatter.format(multa)} | Mora: ${formatter.format(jurosMora)}</span>`;
                } else if (diasAtraso > 0) {
                    acrescimosHtml = `<span class="text-brand-green font-bold">Isento (tolerância)</span>`;
                }

                let diasHtml = diasAtraso > 0 
                    ? `<span class="font-bold ${diasAtraso > 3 ? 'text-red-600 dark:text-red-500' : 'text-yellow-600 dark:text-yellow-500'}">${diasAtraso} dia${diasAtraso > 1 ? 's' : ''}</span>`
                    : '-';
                
                let acoesHtml = `
                    <div class="flex flex-col md:flex-row gap-1 justify-center items-center">
                        <button onclick="baixarParcela(${p.id}, ${p.valor_atualizado})" class="bg-brand-green hover:bg-green-600 text-white px-3 py-1 rounded text-xs transition whitespace-nowrap">
                            <i class="fa-solid fa-check mr-1"></i> Baixar
                        </button>
                `;

                if (isAtrasada && p.cliente_whatsapp) {
                    const numeroLimpo = p.cliente_whatsapp.replace(/\D/g, '');
                    const numeroComDDI = numeroLimpo.startsWith('55') ? numeroLimpo : '55' + numeroLimpo;
                    const mensagem = encodeURIComponent(`Olá, *${p.cliente}*! 👋\n\nNotamos que a parcela *${p.parcela_num}* do seu contrato *${p.numero_contrato}*, com vencimento em *${dataFormatada}*, encontra-se em aberto. 🗓️\n\nO valor atualizado (com juros e multa) é de *${formatter.format(p.valor_atualizado)}*. 💰\n\nCaso já tenha efetuado o pagamento, por favor, desconsidere esta mensagem. 🙏\n\nQualquer dúvida, estamos à disposição! 🤝\n\nAtenciosamente,\n🏢 *Capital Credity*`);
                    
                    acoesHtml += `
                        <a href="https://api.whatsapp.com/send?phone=${numeroComDDI}&text=${mensagem}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-xs transition whitespace-nowrap">
                            <i class="fa-brands fa-whatsapp mr-1"></i> Cobrar
                        </a>
                    `;
                }

                acoesHtml += `</div>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.cliente}</td>
                    <td>${p.numero_contrato}</td>
                    <td>${p.parcela_num}</td>
                    <td class="${isAtrasada ? 'font-bold text-red-600 dark:text-red-500' : ''}">${dataFormatada}</td>
                    <td>${diasHtml}</td>
                    <td>${acrescimosHtml}</td>
                    <td class="font-bold">${formatter.format(p.valor_atualizado)}</td>
                    <td class="font-bold ${statusColor}">${p.status}</td>
                    <td>${acoesHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-4 text-center text-red-500">Erro ao carregar dados.</td></tr>';
            console.error(e);
        }
    }

    async function baixarParcela(id, valor) {
        // Obter cores dependendo do tema atual (apenas para o Swal não ficar feio no modo escuro)
        const isDark = document.documentElement.classList.contains('dark');
        const bg = isDark ? '#2a2a2a' : '#ffffff';
        const color = isDark ? '#ffffff' : '#111827';
        const border = isDark ? 'border-gray-600' : 'border-gray-300';
        
        const { value: formValues } = await Swal.fire({
            title: 'Baixar Parcela',
            background: bg,
            color: color,
            html: `
                <div class="mb-4 text-left">
                    <label class="block text-sm font-bold mb-2">Valor Pago (R$)</label>
                    <input id="swal-valor" class="swal2-input !w-full !m-0 bg-transparent border ${border}" style="color: ${color}" type="number" step="0.01" value="${valor.toFixed(2)}">
                </div>
                <div class="mb-4 text-left">
                    <label class="block text-sm font-bold mb-2">Método de Pagamento</label>
                    <select id="swal-metodo" class="swal2-select !w-full !m-0 bg-transparent border ${border}" style="color: ${color}">
                        <option value="PIX">PIX</option>
                        <option value="DINHEIRO">Dinheiro</option>
                        <option value="TRANSFERENCIA">Transferência</option>
                    </select>
                </div>
            `,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: 'Confirmar Pagamento',
            cancelButtonText: 'Cancelar',
            preConfirm: () => {
                return {
                    valor: document.getElementById('swal-valor').value,
                    metodo: document.getElementById('swal-metodo').value
                }
            }
        });

        if (formValues) {
            try {
                await fetchAPI('/pagamentos/baixa', {
                    method: 'POST',
                    body: JSON.stringify({
                        parcela_id: id,
                        valor_pago: parseFloat(formValues.valor),
                        metodo_pagamento: formValues.metodo,
                        observacao: "Baixado pela Web",
                        taxa_servico: 0.0
                    })
                });
                
                Swal.fire({
                    title: 'Sucesso!', 
                    text: 'Parcela baixada com sucesso.', 
                    icon: 'success',
                    background: bg,
                    color: color
                });
                carregarPendentes();
            } catch(e) {
                Swal.fire({
                    title: 'Erro', 
                    text: e.message || 'Falha ao baixar parcela.', 
                    icon: 'error',
                    background: bg,
                    color: color
                });
            }
        }
    }

    window.onload = carregarPendentes;
</script>
{% endblock %}
