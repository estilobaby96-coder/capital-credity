<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Credity</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00C853">
    <link rel="apple-touch-icon" href="/assets/logo/logo.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 (Para modais de erro/sucesso) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('Service Worker registrado!', reg))
                    .catch(err => console.error('Erro no Service Worker', err));
            });
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#1E1E1E',
                            800: '#252526',
                            700: '#333333'
                        },
                        brand: {
                            green: '#00C853',
                            green_hover: '#00E676'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* ── Tema Claro (padrão) ─────────────── */
        body { background-color: #f3f4f6; color: #111827; }
        .sidebar-app { background-color: #ffffff; border-right: 1px solid #e5e7eb; }
        .btn-green { background-color: #00C853; color: white; transition: 0.2s; }
        .btn-green:hover { background-color: #00E676; }
        .input-field { background-color: #f9fafb; color: #111827; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px; width: 100%; }
        .input-field:focus { outline: none; border-color: #00C853; box-shadow: 0 0 0 2px rgba(0,200,83,0.2); }
        .card { background-color: #ffffff; border: 1px solid #e5e7eb; }
        .table-theme th { background-color: #f9fafb; padding: 12px; text-align: center; color: #374151; border-bottom: 2px solid #e5e7eb; }
        .table-theme td { padding: 12px; border-bottom: 1px solid #e5e7eb; color: #374151; text-align: center; }
        .table-theme tbody tr:hover { background-color: #f3f4f6; }
        .modal-bg { background-color: #ffffff; border: 1px solid #e5e7eb; }
        .content-area { background-color: #f3f4f6; }
        .page-border { border-color: #e5e7eb; }
        .label-text { color: #4b5563; }
        .sub-text { color: #6b7280; }
        .heading-text { color: #111827; }
        .select-field { background-color: #f9fafb; color: #111827; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px; }
        .filter-bg { background-color: #ffffff; border: 1px solid #e5e7eb; }

        /* ── Tema Escuro (quando html tem classe "dark") ─────────────── */
        html.dark body { background-color: #1E1E1E; color: #ffffff; }
        html.dark .sidebar-app { background-color: #252526; border-right: 1px solid #333; }
        html.dark .input-field { background-color: #333; color: #ffffff; border: 1px solid #444; }
        html.dark .input-field:focus { border-color: #00C853; box-shadow: 0 0 0 2px rgba(0,200,83,0.3); }
        html.dark .card { background-color: #242424; border-color: #333; }
        html.dark .table-theme th { background-color: #252526; color: #d1d5db; border-bottom-color: #444; }
        html.dark .table-theme td { border-bottom-color: #333; color: #d1d5db; }
        html.dark .table-theme tbody tr:hover { background-color: #2a2a2a; }
        html.dark .modal-bg { background-color: #2a2a2a; border-color: #555; }
        html.dark .content-area { background-color: #1E1E1E; }
        html.dark .page-border { border-color: #444; }
        html.dark .label-text { color: #9ca3af; }
        html.dark .sub-text { color: #6b7280; }
        html.dark .heading-text { color: #ffffff; }
        html.dark .select-field { background-color: #333; color: #ffffff; border-color: #555; }
        html.dark .filter-bg { background-color: #242424; border-color: #333; }

        /* ── Login Page SEMPRE escuro ─────────────── */
        .login-page { background-color: #1E1E1E !important; color: #ffffff !important; }
        .login-card { background-color: #252526; }
        .login-input { background-color: #333; color: white; border: 1px solid #444; border-radius: 6px; padding: 8px; width: 100%; }
        .login-input:focus { outline: none; border-color: #00C853; }

        /* ── Toggle animado ─────────────── */
        .theme-toggle { position: relative; width: 48px; height: 24px; border-radius: 12px; cursor: pointer; transition: background-color 0.3s; }
        .theme-toggle .toggle-knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: white; transition: transform 0.3s; display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .theme-toggle.light { background-color: #d1d5db; }
        .theme-toggle.dark { background-color: #374151; }
        .theme-toggle.dark .toggle-knob { transform: translateX(24px); }
    </style>
    <script>
        // ── Tema: Inicialização ──
        // Na tela de login, NÃO aplicamos tema (login é sempre escuro)
        // Nas demais telas, verificamos localStorage
        (function() {
            const isLogin = window.location.pathname === '/login';
            if (!isLogin) {
                const saved = localStorage.getItem('theme');
                // Padrão = claro (sem classe "dark")
                if (saved === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
        })();

        // Lógica de Autenticação Global
        function checkAuth() {
            const token = localStorage.getItem('token');
            const isLoginPage = window.location.pathname === '/login';
            
            if (!token && !isLoginPage) {
                window.location.href = '/login';
            } else if (token && isLoginPage) {
                window.location.href = '/';
            }
        }
        
        function logout() {
            Swal.fire({
                title: 'Desconectando...',
                text: 'Obrigado por utilizar o Capital Credity. Tenha um excelente dia!',
                icon: 'info',
                timer: 2000,
                showConfirmButton: false
            }).then(() => {
                localStorage.removeItem('token');
                window.location.href = '/login';
            });
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateToggleButton(isDark);
        }

        function updateToggleButton(isDark) {
            const toggle = document.getElementById('themeToggle');
            if (!toggle) return;
            if (isDark) {
                toggle.className = 'theme-toggle dark';
                toggle.querySelector('.toggle-knob').innerHTML = '🌙';
            } else {
                toggle.className = 'theme-toggle light';
                toggle.querySelector('.toggle-knob').innerHTML = '☀️';
            }
        }

        async function fetchAPI(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const method = options.method || 'GET';
            const cacheKey = 'api_cache_' + endpoint;

            // Limpa o cache caso seja uma mutação (POST, PUT, DELETE)
            if (method !== 'GET') {
                const keysToRemove = [];
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    if (key && key.startsWith('api_cache_')) {
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(k => sessionStorage.removeItem(k));
            }

            // Verifica cache para requisições GET
            if (method === 'GET' && !options.noCache) {
                const cached = sessionStorage.getItem(cacheKey);
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        // Cache duration: 15 seconds
                        if (Date.now() - parsed.time < 15000) {
                            return parsed.data;
                        }
                    } catch (e) {}
                }
            }

            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            
            const response = await fetch(endpoint, {
                ...options,
                headers
            });
            
            if (response.status === 401) {
                logout();
                throw new Error("Sessão expirada");
            }
            
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.detail || "Erro na requisição");
            }
            
            const data = await response.json();

            // Salva no cache
            if (method === 'GET') {
                sessionStorage.setItem(cacheKey, JSON.stringify({
                    time: Date.now(),
                    data: data
                }));
            }
            
            return data;
        }

        checkAuth();

        // ── Auto Logout por Inatividade (15 minutos) ──
        (function() {
            const isLoginPage = window.location.pathname === '/login';
            if (isLoginPage) return;

            let inatividadeTimer;
            const TEMPO_LIMITE = 15 * 60 * 1000; // 15 minutos em ms

            function resetTimer() {
                clearTimeout(inatividadeTimer);
                inatividadeTimer = setTimeout(deslogarPorInatividade, TEMPO_LIMITE);
            }

            function deslogarPorInatividade() {
                localStorage.removeItem('token');
                Swal.fire({
                    title: 'Sessão Expirada',
                    text: 'Você foi desconectado por inatividade para sua segurança.',
                    icon: 'warning',
                    timer: 3000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = '/login';
                });
            }

            window.addEventListener('mousemove', resetTimer);
            window.addEventListener('keydown', resetTimer);
            window.addEventListener('scroll', resetTimer);
            window.addEventListener('click', resetTimer);

            resetTimer();
        })();
    </script>
</head>
<body class="flex h-screen overflow-hidden">
    
    {% block layout %}{% endblock %}

</body>
</html>
