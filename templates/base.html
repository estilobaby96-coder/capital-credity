<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Credity</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 (Para modais de erro/sucesso) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#1E1E1E',
                            800: '#252526',
                            700: '#333333'
                        },
                        brand: {
                            green: '#00C853',
                            green_hover: '#00E676'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body { background-color: #1E1E1E !important; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; position: relative; z-index: 1; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1E1E1E; z-index: -1; }
        .sidebar { background-color: #252526; border-right: 1px solid #333; }
        .btn-green { background-color: #00C853; color: white; transition: 0.2s; }
        .btn-green:hover { background-color: #00E676; }
        .input-dark { background-color: #333; color: white; border: 1px solid #444; border-radius: 4px; padding: 8px; width: 100%; }
        .input-dark:focus { outline: none; border-color: #00C853; }
        .table-dark th { background-color: #252526; padding: 12px; text-align: left; }
        .table-dark td { padding: 12px; border-bottom: 1px solid #333; }
        .table-dark tbody tr:hover { background-color: #2a2a2a; }
    </style>
    <script>
        // Lógica de Autenticação Global
        function checkAuth() {
            const token = localStorage.getItem('token');
            const isLoginPage = window.location.pathname === '/login';
            
            if (!token && !isLoginPage) {
                window.location.href = '/login';
            } else if (token && isLoginPage) {
                window.location.href = '/';
            }
        }
        
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login';
        }

        async function fetchAPI(endpoint, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            
            const response = await fetch(endpoint, {
                ...options,
                headers
            });
            
            if (response.status === 401) {
                logout();
                throw new Error("Sessão expirada");
            }
            
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.detail || "Erro na requisição");
            }
            
            return response.json();
        }

        checkAuth();
    </script>
</head>
<body class="flex h-screen overflow-hidden">
    
    {% block layout %}{% endblock %}

</body>
</html>
